# Semantic overlay for DataTable - the hand-written half of the contract.
#
# Two contracts live in this directory (see data-table-sort-button.contract.yaml
# for the other): DataTable and DataTableSortButton are two independent
# top-level exports, not a compound family like Accordion's root and parts - so
# neither states a family. Every OTHER export of this file
# (dataTableColumnHelper, dataTableFeatures, dataTableSelectionColumn,
# DataTableSelectionColumnLabels) is a function or a type, not a React
# component - the extractor generates no contract for them at all, and three of
# them show up here instead, as `companions`.
component: data-table

intent: Render tabular data with sorting, optional row selection, and pagination from one columns/data pair.

typical_uses:
  - Tabular data with more rows than fit on one screen, where the user sorts a column
  - A list the user selects rows from for a bulk action
  - Paged results the user steps through instead of scrolling one long list

dont_use_when:
  - situation: Static markup with no sorting, selection or pagination need
    instead:
      target: Table
      component: gts.frontx.uikit.base.component.v1~frontx.uikit.component.table.v1~

# DataTable takes no children at all - not even text: DataTableProps has no
# `children` field, and the component renders Table/TableHeader/TableBody
# internally from `columns`/`data`. "text" would claim a slot that does not
# exist, and an absent statement would read as unconstrained, so `content` is
# "nothing" and carries no detail beside it.
accepts:
  content: nothing

invariants:
  - id: columns-and-data-share-row-type
    text: >-
      `columns` and `data` are both generic over the same `TData` - a
      `ColumnDef` built for one row shape used against a `data` array of a
      different shape is a type error at the call site, not a runtime
      contract this schema can assert.
  - id: selection-column-is-a-separate-opt-in
    text: >-
      `enableRowSelection` alone makes rows selectable and turns on the
      footer's "N of M row(s) selected" text; it renders no checkbox column
      by itself. A checkbox column only appears when `columns` also includes
      one built with `dataTableSelectionColumn()`.
  - id: page-size-must-be-positive
    text: >-
      `pageSize` seeds and live-resyncs the internal pagination state; zero
      or negative values make the page-index rescale on prop change
      (`current.pageIndex * current.pageSize / pageSize`) divide by zero or
      go negative, so it must stay a positive integer.

anti_patterns:
  - dont: Mix column defs built against different TFeatures objects in one `columns` array
    instead: Build every column with `dataTableColumnHelper()` (or a hand-rolled helper bound to the same `dataTableFeatures`), never a mix
  - dont: Set `enableRowSelection` and expect a checkbox column to appear on its own
    instead: Include `dataTableSelectionColumn()` in `columns` explicitly - the flag and the column are independent opt-ins

deprecations: {}

attestations:
  a11y:
    outcome: unknown
  rtl:
    outcome: unknown

untyped:
  - about: behaviour
    claim: sorting, row-selection and pagination state are internal, not props
    reason: >-
      `sorting`/`rowSelection`/`pagination` are component-owned useState,
      never lifted to DataTableProps, so there is no way to preset or
      control them - "DataTable is sortable/selectable/paginated" is
      discoverable only from `columns`' own fields and
      `enableRowSelection`. A consumer needing controlled state builds
      against `useTable` directly (see the dataTableFeatures companion).
  - about: prop
    prop: columns
    claim: columns is an array of @tanstack/react-table ColumnDef objects, generic over TData
    reason: >-
      The schema states that this is an array and stops there. ColumnDef
      carries function-valued fields (header/cell render functions among
      them) from a third-party package this contract does not own, and it
      is generic over the row type the caller picks - so what is IN the
      array is checked by tsc, and is why the prop is a slot rather than
      an enumerated shape.
  - about: prop
    prop: data
    claim: data is an array of the caller's own row type
    reason: >-
      `TData[]` - an array, which the schema does state, of a type
      parameter the caller picks, which it cannot. The rows must be the
      same `TData` the `columns` were built for; that pairing is a
      call-site type error, not something this schema can check.
  - about: prop
    prop: selectionSummary
    claim: selectionSummary is a function prop, not data
    reason: >-
      `(selected, total) => ReactNode` has no JSON Schema representation;
      it is a function returning a plurals-aware sentence, not a value
      this schema can assert shape against.
  - about: prop
    prop: emptyMessage
    claim: emptyMessage is a React node, not a string
    reason: >-
      `ReactNode` - an element, a string or a fragment, all valid and
      indistinguishable to JSON Schema. It replaces the whole
      "no results" row body, so an element is the usual case.
  - about: prop
    prop: previousLabel
    claim: previousLabel is a React node, not a string
    reason: >-
      `ReactNode`, so an icon or an element is as valid as a string. It is
      the pagination button's own label, which is why it is a node rather
      than a translated string this component would have to own.
  - about: prop
    prop: nextLabel
    claim: nextLabel is a React node, not a string
    reason: >-
      `ReactNode`, same as previousLabel above and for the same reason.

examples:
  good:
    - title: Sortable, selectable, paginated table
      code: |
        const columnHelper = dataTableColumnHelper<Payment>();
        const columns = columnHelper.columns([
          dataTableSelectionColumn<Payment>(),
          columnHelper.accessor('status', { header: 'Status' }),
          columnHelper.accessor('email', {
            header: ({ column }) => <DataTableSortButton column={column}>Email</DataTableSortButton>,
          }),
        ]);
        <DataTable columns={columns} data={payments} enableRowSelection />
  bad:
    - title: enableRowSelection with no selection column
      code: <DataTable columns={columns} data={payments} enableRowSelection />
      why: >-
        Without a column built by `dataTableSelectionColumn()` in `columns`,
        rows become internally selectable (the footer count can change) but
        nothing in the rendered table lets a user actually select one - the
        flag and the column are independent opt-ins, and this omits the
        second one.

# The prop a consumer fills whose type this schema cannot assert.
slots:
  - prop: columns
    typed_by: '@tanstack/react-table ColumnDef<DataTableFeatures, TData>'
    description: >-
      Column definitions - what data each column reads, how its header and
      cells render, and whether it participates in sorting. The one required
      way to shape what DataTable renders.

# What a consumer turns on, and the prop that turns it on.
capabilities:
  - name: row_selection
    enabled_by: enableRowSelection
    typed_by: '@tanstack/react-table rowSelectionFeature, one of the three features dataTableFeatures registers'
    description: >-
      Rows become selectable and the footer reports "N of M row(s) selected".
      The checkbox column is a separate opt-in: it appears only when `columns`
      also includes one built with `dataTableSelectionColumn()`.

# The exports beside the component that a consumer builds its input with.
companions:
  - export: dataTableColumnHelper
    typed_by: '@tanstack/react-table createColumnHelper, pre-bound to DataTableFeatures'
    description: A createColumnHelper pre-bound to DataTableFeatures - the one column helper every DataTable column def should be built with.
  - export: dataTableSelectionColumn
    typed_by: 'returns @tanstack/react-table ColumnDef<DataTableFeatures, TData>'
    description: Ready-made row-selection column (checkbox header/cell) a consumer spreads into `columns` to opt into selectable rows.
  - export: dataTableFeatures
    typed_by: '@tanstack/react-table tableFeatures({ rowSelectionFeature, rowSortingFeature, rowPaginationFeature, ... })'
    description: >-
      The fixed TanStack Table v9 feature set DataTable registers - row
      selection, row sorting, row pagination. Not configurable per instance;
      a consumer needing a different feature set (filtering, column
      visibility, grouping, ...) builds directly against `useTable` with this
      set as the starting point (see data-table.md's Escape hatch).
