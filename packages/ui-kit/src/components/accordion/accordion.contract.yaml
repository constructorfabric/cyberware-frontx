# Semantic overlay for Accordion (the root) - the hand-written half of one
# of four contracts describing this compound component. See
# accordion-item.contract.yaml, accordion-trigger.contract.yaml and
# accordion-content.contract.yaml for the rest of the family, and `family`
# below for how a reader (or the conformance test) walks between them.
#
# Machine-extractable facts (axis names, axis values, defaults, prop list)
# do NOT belong here: the compiler takes those from accordion.tsx, and
# rejects an overlay that tries to restate them - one fact, one owner.
component: accordion

intent: Show one or more sections at a time, collapsing the rest to their headers.

typical_uses:
  - A list of independent sections (FAQ, settings groups) too long to show
    all at once, where the user opens what is relevant
  - Progressive disclosure of grouped content under named headers

dont_use_when:
  - rule: A single show/hide toggle for one piece of content
    instead: gts.frontx.uikit.component.collapsible.v1~ # Collapsible
  - rule: Primary navigation between sections that stays visible
    instead: gts.frontx.uikit.component.tabs.v1~ # Tabs

composition:
  children:
    kinds: [gts.frontx.uikit.component.accordion_item.v1~] # AccordionItem

invariants:
  - id: multiple-false-at-most-one-open
    text: >-
      With `multiple` at its default of false, opening one item closes any
      other open item - at most one item is open at a time.
  - id: item-values-unique-per-root
    text: >-
      Every `AccordionItem`'s `value` must be unique within THIS root - not
      across roots. Base UI's Accordion.Root keeps its own value state and
      its own keyboard-navigation list, each scoped to that root's React
      context; a nested `Accordion` inside another's panel resolves its
      OWN root context, so its items may safely reuse a value already used
      by an ancestor root without any collision.

anti_patterns:
  - dont: Put an always-visible required form control inside a collapsed panel
    instead: >-
      Keep required fields outside the accordion, or default that item's
      panel open - a screen reader user tabbing through the page will not
      discover a hidden required field until they expand that section
  - dont: Reuse the same `value` for two items inside the SAME accordion root
    instead: >-
      Give every item a unique `value` within its own root - a nested
      `Accordion` needs no coordination with its ancestor's values, only
      with its own siblings

# None yet.
deprecations: {}

# "verified: no" and "not described" are different answers - say which.
coverage:
  a11y: verified # keyboard nav between triggers, ARIA expanded/controls wiring come from Base UI
  rtl: not-described
  assumptions:
    - claim: value, defaultValue and onValueChange are typed in terms of a generic Value parameter
      reason: >-
        JSON Schema has no notion of a generic type parameter, so these stay
        annotation-only (slots) in the compiled contract rather than typed
        properties. accordion.md's own example uses string values
        (value="item-1"), which is the documented usage.

examples:
  good:
    - title: Two sections, single-expansion (the default)
      code: |
        <Accordion>
          <AccordionItem value="item-1">
            <AccordionTrigger>Is it accessible?</AccordionTrigger>
            <AccordionContent>Yes. It adheres to the WAI-ARIA design pattern.</AccordionContent>
          </AccordionItem>
          <AccordionItem value="item-2">
            <AccordionTrigger>Is it styled?</AccordionTrigger>
            <AccordionContent>Yes, with the kit's own tokens.</AccordionContent>
          </AccordionItem>
        </Accordion>
  bad:
    - title: A single section used as a show/hide toggle
      code: |
        <Accordion>
          <AccordionItem value="only">
            <AccordionTrigger>Show details</AccordionTrigger>
            <AccordionContent>Details go here.</AccordionContent>
          </AccordionItem>
        </Accordion>
      why: >-
        One section is not what an accordion is for - it carries Base UI's
        multi-item expansion machinery for nothing to coordinate. Reach for
        `Collapsible` instead.

# Family membership - see compile.ts's Family type. The root names every
# part; a part (accordion-item.contract.yaml, ...) points back with `role:
# part` and no `parts` of its own.
family:
  root: gts.frontx.uikit.component.accordion.v1~
  role: root
  parts:
    - gts.frontx.uikit.component.accordion_item.v1~ # AccordionItem
    - gts.frontx.uikit.component.accordion_trigger.v1~ # AccordionTrigger
    - gts.frontx.uikit.component.accordion_content.v1~ # AccordionContent
