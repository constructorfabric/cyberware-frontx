# UI Kit owns the PRD, the DESIGN and the FEATURE that describe it, same shape and rationale as
# gts-plugin above. This entry is what lifted the package-wide `packages/ui-kit/**` [[ignore]]: the
# ignore's own removal criterion was this registration, in the autodetect form with PRD, DESIGN and
# FEATURE required, because `required` flags do not inherit and the explicit-artifact-list form
# validates while enforcing nothing. DECOMPOSITION and ADR are omitted rather than declared
# optional: a member never owns a DECOMPOSITION, and this member owns no decision of its own yet.
# One codebase path: `scripts` holds the contract harness, which carries the markers today. `src`
# holds the components those contracts describe and is deliberately NOT registered here - nothing
# under it is marked, and no FEATURE yet gives the component surface numbered instructions for a
# marker to point at. Registering it anyway would put ~200 unmarked component-source files under
# scan with no instruction to satisfy, which is exactly the debt the former package-wide ignore
# recorded, only narrower now that the package's own PRD/DESIGN/FEATURE chain exists and the member
# is registered. That debt is recorded instead by its own path-anchored [[ignore]] for
# packages/ui-kit/src/** below (with its removal criterion), rather than by registering the path
# and leaving every file in it an unmarked, uncounted gap. `scripts` is declared here anyway so this
# member's scanned surface is stated by its own registration rather than inherited from the root
# system's packages/ + .ts/.tsx/.mjs catch-all, which would also reach it now that the package-wide
# ignore is gone.
[[systems.children]]
name = "UI Kit"
slug = "ui-kit"
kit = "sdlc"
artifacts_dir = "packages/ui-kit/architecture"

[[systems.children.autodetect]]
kit = "sdlc"
system_root = "{project_root}"
artifacts_root = "packages/ui-kit/architecture"

[systems.children.autodetect.artifacts.PRD]
pattern = "PRD.md"
traceability = "FULL"
required = true

[systems.children.autodetect.artifacts.DESIGN]
pattern = "DESIGN.md"
traceability = "FULL"
required = true

[systems.children.autodetect.artifacts.FEATURE]
pattern = "features/*/FEATURE.md"
traceability = "FULL"
required = true

[[systems.children.codebase]]
path = "packages/ui-kit/scripts"
extensions = [".ts"]
