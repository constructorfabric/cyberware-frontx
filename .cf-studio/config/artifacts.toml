# CLI owns the FEATUREs and the DESIGN that describe scaffolding and the template
# lifecycle, same shape and rationale as gts-plugin above. ecosystem-distribution is NOT
# here: it is ecosystem-wide policy the root owns (cpt-frontx-component-ecosystem-version-policy),
# with its spec in the root features/ tree next to the root-owned enforcement code in
# scripts/. The PRD owns the package's requirements per the 3-layer model.
[[systems.children]]
name = "CLI"
slug = "cli"
kit = "sdlc"
artifacts_dir = "packages/cli/architecture"

[[systems.children.autodetect]]
kit = "sdlc"
system_root = "{project_root}"
artifacts_root = "packages/cli/architecture"

[systems.children.autodetect.artifacts.PRD]
pattern = "PRD.md"
traceability = "FULL"
required = true

[systems.children.autodetect.artifacts.DESIGN]
pattern = "DESIGN.md"
traceability = "FULL"
required = true

[systems.children.autodetect.artifacts.FEATURE]
pattern = "features/*/FEATURE.md"
traceability = "FULL"
required = true

# The CLI is the first member to own an ADR of its own: a decision about how a
# template declares the ground it owns is the CLI's, not the ecosystem's, and
# ADR-0031 was moved under this system for that reason. Declared `required =
# false` because owning an ADR is a member's option, not its obligation. The
# omission of ADR from the members above is not a rule against it - only
# DECOMPOSITION is structurally forbidden to a member - and without this pattern
# the moved file is discovered by nothing, leaving 25 references to
# `cpt-frontx-adr-template-ownership-boundary-declaration` dangling.
[systems.children.autodetect.artifacts.ADR]
pattern = "ADR/**/*.md"
traceability = "FULL"
required = false

[[systems.children.codebase]]
path = "packages/cli/src"
extensions = [".ts"]

