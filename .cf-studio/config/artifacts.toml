# Studio artifacts registry

[[ignore]]
reason = "Build artifacts and dependencies"
patterns = ["*/dist/*", "*/node_modules/*", "*/templates/*"]

[[ignore]]
reason = "Test files use scenario IDs, not CDSL begin/end markers"
patterns = ["*.test.*", "*.spec.*", "*/__tests__/*"]

[[ignore]]
reason = "CLI template sources are code-gen templates, not implementable source"
patterns = ["*/template-sources/*"]

[[ignore]]
reason = "Build/bundler configuration files have no CDSL backing"
patterns = ["*/tsup.config.*", "*/vite.config.*", "*/vitest.config.*", "*/postcss.config.*", "*/tailwind.config.*"]

[[ignore]]
reason = "In-package demos exercise a package's public surface rather than implementing a requirement, so no instruction exists for a marker to point at. Structural and permanent — this is not a placeholder for missing artifacts and must never be given an expiry."
patterns = ["*/demo/*"]

[[ignore]]
reason = "These globs cover template territory — top-level directories carrying a frontx-template.json manifest — outside the ecosystem artifact universe (cpt-frontx-adr-template-territory-traceability); residue markers bind nothing and are removed as files are touched — no active FEATURE artifact backs this template territory"
patterns = ["template-shell/**", "template-mfe/**", "template-design-guardrails/**"]

[[ignore]]
reason = "UI Kit package has no backing CDSL artifact yet. Removal criterion per the member artifact chain (cpt-frontx-constraint-member-artifact-chain, root DESIGN section 2.2): ui-kit is registered as its own child system owning a PRD, a DESIGN, and at least one FEATURE (never a DECOMPOSITION), per the member artifact chain's 3-layer rule. NOT satisfied by adding a requirement to the root PRD or a component to the root DESIGN - that is the centralized shape the layer partition replaced."
patterns = ["packages/ui-kit/**"]

[[ignore]]
reason = "Unmarked build/test tooling has no CDSL backing. Four CI guards added after this entry was last enumerated belong to the same category and are registered here: scripts/version-bump-on-change-check.mjs (#575) diffs a PR against its merge base and fails any governed package whose substantive changes came without a version bump; scripts/mfes-import-boundary-check.mjs (#540) reads the mfes barrel and its consumers to fail concrete-implementation exports and deep imports across the ADR-0003 boundary; packages/mfes/scripts/verify-dist-import-pragmas.mjs (#504) greps the two built dist formats to fail a build that dropped the webpackIgnore / @vite-ignore comments off the blob-module dynamic import; scripts/pin-unpublished-ecosystem-to-local-pack.mjs (#613) asks the registry whether each composed ecosystem pin resolves and, for a version this checkout itself declares, installs an npm pack tarball of it so a correctly-bumped pull request is not red before its packages publish. Three read the tree, the build output or the registry and exit non-zero; the fourth (pin-unpublished-ecosystem-to-local-pack.mjs) also writes pack tarballs to .frontx-local-packs/ and temporarily rewrites manifests until its own --restore call puts them back. None of the four implements ecosystem behaviour a numbered instruction specifies, so no marker has an instruction to point at. verify-dist-import-pragmas is listed as its own pattern rather than under scripts/ because it lives beside the package it guards and reaches the scan through the root system's packages/ + .mjs catch-all, not through the scripts/ codebase entry. NOTE: scripts/ecosystem-version-policy.mjs (ecosystem-distribution), scripts/package-edge-tests.ts and scripts/verify-guard-configs.ts (ecosystem-governance), and scripts/test-architecture.ts carry @cpt markers and MUST stay scanned — they are deliberately NOT ignored here. STILL UNREGISTERED, and deliberately left for their own decision rather than folded in here: scripts/link-template-ecosystem.mjs, scripts/pin-template-ecosystem-to-local.mjs, scripts/template-pin-drift-check.mjs, scripts/template-lockfile-selflink-check.mjs, scripts/template-ecosystem-packages.mjs, scripts/template-discovery.mjs, scripts/validate-templates.mjs, scripts/token-format-check.mjs, scripts/generate-guideline-index.mjs and scripts/fs-types.mjs are the same unmarked-tooling category and together carry ~1200 scanned lines against the coverage ratio - registering them would move the measured number far more than any one change should."
patterns = ["scripts/test-runner/*", "scripts/manual-auth-tests/*", "scripts/check-test-dependency-versions.mjs", "scripts/run-monorepo-unit-tests.mjs", "scripts/version-bump-on-change-check.mjs", "scripts/mfes-import-boundary-check.mjs", "scripts/pin-unpublished-ecosystem-to-local-pack.mjs", "packages/mfes/scripts/verify-dist-import-pragmas.mjs"]

[[ignore]]
reason = "A kit skill's helper script is tooling the kit installs for an agent to run, not ecosystem behaviour a numbered instruction specifies, so no marker has an instruction to point at. The registry already says as much: the kit's own registered codebase is packages/cyber-pilot-kit-frontx/src with .ts only (see its [[systems.children.codebase]] below), and these .mjs helpers reach the scan solely through the root system's packages/ + .mjs catch-all. Removal criterion: this entry is lifted once the kit registers a skills/ path in its own [[systems.children.codebase]] and a kit FEATURE gives the script numbered instructions to carry. NOT satisfied by adding skills/ to the root system's codebase - that is the catch-all this entry corrects. Scoped to skills/*/scripts/* rather than the package or all of skills/, so the kit's src/ stays scanned and its SKILL.md and checklist assets keep their current treatment."
patterns = ["packages/cyber-pilot-kit-frontx/skills/*/scripts/*"]

[[systems]]
name = "FrontX Dev Kit"
slug = "frontx"
kit = "sdlc"
artifacts_dir = "architecture"

[[systems.autodetect]]
kit = "sdlc"
system_root = "{project_root}"
artifacts_root = "architecture"

[systems.autodetect.artifacts]
[systems.autodetect.artifacts.PRD]
pattern = "PRD.md"
traceability = "FULL"

[systems.autodetect.artifacts.DESIGN]
pattern = "DESIGN.md"
traceability = "FULL"

[systems.autodetect.artifacts.DECOMPOSITION]
pattern = "DECOMPOSITION.md"
traceability = "FULL"

[systems.autodetect.artifacts.ADR]
pattern = "ADR/**/*.md"
traceability = "FULL"
required = false

[systems.autodetect.artifacts.FEATURE]
pattern = "features/*/FEATURE.md"
traceability = "FULL"
required = false

[[systems.codebase]]
path = "packages/"
extensions = [".ts", ".tsx", ".mjs"]

[[systems.codebase]]
path = "src/"
extensions = [".ts"]

[[systems.codebase]]
path = "scripts/"
extensions = [".mjs", ".ts"]

# Telemetry owns the artifacts that describe it, per the ecosystem layer-partition and
# artifact-federation decision. The autodetect form is deliberate: `required` flags do not inherit
# from the parent, and the explicit-artifact-list form validates while enforcing nothing at all —
# which would leave the member artifact chain an honour system. DECOMPOSITION and ADR are omitted
# rather than declared optional: a member never owns a DECOMPOSITION, whose purpose is organizing a
# large design into features.
[[systems.children]]
name = "Telemetry"
slug = "telemetry"
kit = "sdlc"
artifacts_dir = "packages/telemetry/architecture"

[[systems.children.autodetect]]
kit = "sdlc"
system_root = "{project_root}"
artifacts_root = "packages/telemetry/architecture"

[systems.children.autodetect.artifacts.DESIGN]
pattern = "DESIGN.md"
traceability = "FULL"
required = true

[systems.children.autodetect.artifacts.FEATURE]
pattern = "features/*/FEATURE.md"
traceability = "FULL"
required = true

# Every member owns a PRD per the 3-layer model: each member explains its own reqs;
# the root PRD describes the layers.
[systems.children.autodetect.artifacts.PRD]
pattern = "PRD.md"
traceability = "FULL"
required = true

[[systems.children.codebase]]
path = "packages/telemetry/src"
extensions = [".ts"]

