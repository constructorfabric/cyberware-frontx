name: Publish Packages

on:
  push:
    branches: [main, develop, 'release/v*']

permissions:
  contents: read

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # FrontX ecosystem packages (packages/*)
  # Version-gated: a package publishes only when its package.json `version`
  # changed in this push. Ecosystem packages publish INDEPENDENTLY (F1
  # policy) — no layer/dependency ordering.
  #
  # The templates that consume these packages (@gears-frontx/api,
  # @gears-frontx/mfes, @gears-frontx/gts-plugin, ...) now live in their own
  # repository with their own publish workflow; this job no longer needs to
  # account for them.
  # ══════════════════════════════════════════════════════════════════════
  detect-ecosystem:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history needed for github.event.before comparison

      - name: Detect version changes
        id: detect
        run: |
          PACKAGES=()
          BASE_COMMIT="${{ github.event.before }}"
          echo "Comparing HEAD against pre-push state: $BASE_COMMIT"

          for pkg_dir in packages/*/; do
            pkg_json="${pkg_dir}package.json"
            [ -f "$pkg_json" ] || continue

            # Private packages can never be published — skip them. Without
            # this, a package that is private while it matures (ui-kit until
            # its MVP set lands) enters the matrix on its first commit and
            # fails the run on `npm publish`.
            IS_PRIVATE=$(jq -r '.private // false' "$pkg_json")
            if [ "$IS_PRIVATE" = "true" ]; then continue; fi

            if git diff "$BASE_COMMIT" --name-only | grep -q "^${pkg_json}$"; then
              OLD_VERSION=$(git show "$BASE_COMMIT":"$pkg_json" 2>/dev/null | jq -r '.version' || echo "")
              NEW_VERSION=$(jq -r '.version' "$pkg_json")
              NPM_NAME=$(jq -r '.name' "$pkg_json")

              if [ "$OLD_VERSION" != "$NEW_VERSION" ] && [ -n "$NEW_VERSION" ]; then
                echo "Version change detected: $NPM_NAME $OLD_VERSION -> $NEW_VERSION"
                PACKAGES+=("{\"name\":\"$NPM_NAME\",\"path\":\"${pkg_dir%/}\",\"version\":\"$NEW_VERSION\"}")
              fi
            fi
          done

          if [ ${#PACKAGES[@]} -eq 0 ]; then
            echo "No ecosystem packages with version changes"
            echo "packages=[]" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            # PUBLISH ORDER: @gears-frontx/gts-plugin declares an EXACT
            # dependency on @gears-frontx/mfes, so publishing it first puts a
            # tarball on the registry whose own dependency does not resolve yet.
            # Anyone installing gts-plugin in that window gets an ETARGET; the
            # window closes only when mfes lands. Directory-glob order above is
            # alphabetical, which puts gts-plugin BEFORE mfes - precisely the
            # wrong way round (review round 3 on #492).
            #
            # mfes first, gts-plugin last, everything else in between: the two
            # ranks encode the one intra-ecosystem exact pin that exists, and
            # `policy:ecosystem-pin-drift` is what keeps that pin honest, so a
            # second such edge cannot appear here unnoticed.
            JSON_ARRAY=$(printf '%s\n' "${PACKAGES[@]}" | jq -sc '
              def publishRank:
                if . == "@gears-frontx/mfes" then 0
                elif . == "@gears-frontx/gts-plugin" then 2
                else 1 end;
              sort_by((.name | publishRank), .name)')
            echo "Publish order: $(echo "$JSON_ARRAY" | jq -r '[.[].name] | join(" -> ")')"
            echo "packages=$JSON_ARRAY" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  publish-ecosystem:
    needs: detect-ecosystem
    if: needs.detect-ecosystem.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      skipped: ${{ steps.publish.outputs.skipped }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '25.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Edge-compatibility check (independent publication)
        # F1 Ecosystem Distribution & Versioning Policy — per-concern INDEPENDENT
        # versioning: each artifact publishes on its own semver line; NO matched-
        # version gate. Blocks publication only of @gears-frontx/mfes, and only
        # when its declared @gears-frontx/gts-plugin range is an exact pin or is
        # unsatisfiable against the published gts-plugin version(s).
        run: npm run policy:version-check

      - name: Build ecosystem packages
        run: npm run build:packages

      - name: Publish packages
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGES='${{ needs.detect-ecosystem.outputs.packages }}'
          PUBLISHED_PACKAGES=()
          SKIPPED_PACKAGES=()

          BRANCH="${GITHUB_REF#refs/heads/}"
          get_npm_tag() {
            local version="$1"
            if [[ "$BRANCH" =~ ^release/v([0-9]+)$ ]]; then echo "v${BASH_REMATCH[1]}";
            elif [[ "$BRANCH" == "develop" ]]; then echo "alpha";
            elif [[ "$BRANCH" == "main" ]]; then
              if [[ "$version" == *"-alpha"* ]]; then echo "alpha";
              elif [[ "$version" == *"-rc"* ]]; then echo "next";
              else echo "latest"; fi
            elif [[ "$version" == *"-alpha"* ]]; then echo "alpha";
            elif [[ "$version" == *"-beta"* ]]; then echo "beta";
            elif [[ "$version" == *"-rc"* ]]; then echo "next";
            else echo "latest"; fi
          }

          publish_with_retry() {
            local tag="$1" max_attempts=3 attempt=1 delay=5
            while [ $attempt -le $max_attempts ]; do
              echo "Publish attempt $attempt of $max_attempts..."
              if npm publish --access public --tag "$tag"; then return 0; fi
              if [ $attempt -lt $max_attempts ]; then
                echo "Attempt $attempt failed. Retrying in ${delay}s..."
                sleep $delay; delay=$((delay * 2))
              fi
              attempt=$((attempt + 1))
            done
            echo "All $max_attempts attempts failed"; return 1
          }

          # Independent VERSIONING - each artifact publishes on its own semver
          # line, with no matched-version gate. That is not the same as
          # independent ORDER: `detect-ecosystem` hands this list over already
          # sorted so mfes precedes gts-plugin, which pins it exactly.
          for row in $(echo "$PACKAGES" | jq -r '.[] | @base64'); do
            _jq() { echo "${row}" | base64 --decode | jq -r "${1}"; }
            NAME=$(_jq '.name'); PKG_PATH=$(_jq '.path'); VERSION=$(_jq '.version')

            echo ""
            echo "=========================================="
            echo "Processing: $NAME@$VERSION"
            echo "=========================================="

            if npm view "$NAME@$VERSION" version 2>/dev/null; then
              echo "SKIPPING: $NAME@$VERSION already exists on NPM"
              SKIPPED_PACKAGES+=("{\"name\":\"$NAME\",\"version\":\"$VERSION\",\"reason\":\"already exists on NPM\"}")
              continue
            fi

            NPM_TAG=$(get_npm_tag "$VERSION")
            echo "Publishing $NAME@$VERSION with tag '$NPM_TAG'..."
            ( cd "$PKG_PATH" && publish_with_retry "$NPM_TAG" ) || { echo "FAILED: $NAME@$VERSION"; exit 1; }

            echo "SUCCESS: Published $NAME@$VERSION"
            PUBLISHED_PACKAGES+=("{\"name\":\"$NAME\",\"version\":\"$VERSION\"}")
          done

          if [ ${#PUBLISHED_PACKAGES[@]} -eq 0 ]; then echo "published=[]" >> $GITHUB_OUTPUT;
          else echo "published=$(printf '%s\n' "${PUBLISHED_PACKAGES[@]}" | jq -sc '.')" >> $GITHUB_OUTPUT; fi
          if [ ${#SKIPPED_PACKAGES[@]} -eq 0 ]; then echo "skipped=[]" >> $GITHUB_OUTPUT;
          else echo "skipped=$(printf '%s\n' "${SKIPPED_PACKAGES[@]}" | jq -sc '.')" >> $GITHUB_OUTPUT; fi

  # ══════════════════════════════════════════════════════════════════════
  # Summary
  # ══════════════════════════════════════════════════════════════════════
  summary:
    needs: [detect-ecosystem, publish-ecosystem]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish summary
        run: |
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          report() {
            local title="$1" has_changes="$2" result="$3" published="$4" skipped="$5"
            echo "### $title" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$has_changes" != "true" ]; then
              echo "No packages with version changes to publish." >> $GITHUB_STEP_SUMMARY
            elif [ "$result" == "success" ]; then
              local pc sc
              pc=$(echo "$published" | jq 'length'); sc=$(echo "$skipped" | jq 'length')
              if [ "$pc" -gt 0 ]; then
                echo "✅ Published ($pc):" >> $GITHUB_STEP_SUMMARY
                echo "$published" | jq -r '.[] | "- `\(.name)@\(.version)`"' >> $GITHUB_STEP_SUMMARY
              fi
              if [ "$sc" -gt 0 ]; then
                echo "⏭️ Skipped ($sc):" >> $GITHUB_STEP_SUMMARY
                echo "$skipped" | jq -r '.[] | "- `\(.name)@\(.version)` — \(.reason)"' >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "❌ Publish failed. Check workflow logs for details." >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          }

          report "Ecosystem packages" \
            "${{ needs.detect-ecosystem.outputs.has_changes }}" \
            "${{ needs.publish-ecosystem.result }}" \
            '${{ needs.publish-ecosystem.outputs.published }}' \
            '${{ needs.publish-ecosystem.outputs.skipped }}'
