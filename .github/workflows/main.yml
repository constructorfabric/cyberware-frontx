name: Main CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Every job here only reads the repo: nothing pushes, comments, or releases —
# upload-artifact needs no contents scope. Declared once at the workflow level
# (with persist-credentials: false on each checkout) so the default read/write
# token never reaches repository-controlled scripts. The token is present at all
# only to clear the anonymous rate limit on GitHub API calls (see
# studio-validate*'s own GITHUB_TOKEN comment), which read-only contents access
# is enough for.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.14.x, 25.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        # #575: policy:version-bump-on-change needs a merge base with the
        # PR's target branch, and a shallow (depth-1) checkout has no history
        # to compute one from. Full history costs little here — this repo is
        # small — and matches the same choice already made in docs.yml and
        # publish-packages.yml for the same reason.
        fetch-depth: 0

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: npm ci

    # MFE packages are template content — the template-validate job below
    # installs and checks them.

    # Consumer packages (framework, react, studio, cli) resolve workspace deps
    # via their sibling packages' `dist/` types. A fresh `npm ci` has no dist,
    # so `type-check:packages:*` fails to resolve `@gears-frontx/*` imports.
    # Build the packages first so tsc can resolve types across workspaces.
    - name: Build workspace packages
      run: npm run build:packages

    - name: Run TypeScript validation
      run: npm run type-check:all

    - name: Run lint (includes test-dep version guard via lint:deps)
      run: npm run lint

    # Sequential `--coverage` (no `--parallel`) to keep v8 instrumentation under
    # the per-test timeout budget. Parallel project spawns + coverage workers
    # together caused intermittent 5s test timeouts in resource-constrained
    # runners. Gates the COVERAGE_THRESHOLDS defined in vitest.shared.ts.
    - name: Run unit tests with coverage gating
      run: npm run test:unit -- --coverage

    # Packaging acceptance for the published surface: pack the kit, install the
    # tarball into a clean Vite project and assert the tokens, component styles
    # and CSS-module class map survive the consumer's build. Kept out of the
    # unit-test runner (it packs and installs, so it is a slow lane), which is
    # why it runs as its own step.
    - name: Verify ui-kit installs into a clean consumer
      run: npm run test:consumer --workspace=@gears-frontx/ui-kit

    - name: Audit dependencies for high severity vulnerabilities
      run: npm audit --audit-level=high --omit=dev

    - name: Run architecture validation
      run: npm run arch:check

    # arch:check covers the ecosystem import graph via the root config
    # (dependency-cruiser + greps). That coverage was itself vacuous until this
    # change: the root config excluded `packages/*/dist`, and since a workspace
    # import resolves through `exports`/`main` to exactly that path, the node
    # every cross-package rule needed as its `to` was deleted from the graph —
    # a deliberate `@gears-frontx/api` import in `packages/mfes/src` stayed
    # green. The root config now bounds `dist` and `node_modules` with
    # `doNotFollow` instead and matches all three resolution shapes, so the
    # sentence above is true rather than aspirational.
    #
    # These three cover what arch:check still does not: the Core Framework layer
    # rules applied per-package, the package.json edges of the boundary model,
    # and the integrity of the shared boundary configs themselves. All three
    # were unreferenced by CI before #476, which is how they drifted into
    # failing unnoticed after the framework/template split.
    - name: Run Core Framework layer rules (import graph)
      run: npm run arch:deps:core

    - name: Run package edge validation (package.json edges)
      run: npm run arch:edges

    - name: Run guard config verification
      run: npm run arch:guards

    # #493: prepublish manifest+content validation (`frontx validate`) against
    # every template at the repo root (a directory carrying
    # `frontx-template.json`, ADR-0018 - not a `template-*` name guess) -
    # nothing ran this command in CI before. Generic by construction: no
    # template name is hardcoded here or in the script, which is why #470's
    # split of `template-standard/` into `template-shell/` plus `template-mfe/`
    # needed no change to either and both are now covered. BUILD ORDER: imports
    # `@gears-frontx/cli` directly, so this must run after "Build workspace
    # packages" above has produced `packages/cli/dist`.
    - name: Validate template manifests (prepublish, content self-containment)
      run: npm run validate:templates

    # #493: every site pinning an ecosystem package (`@gears-frontx/api`,
    # `mfes`, `gts-plugin`, #485/PR #492) to an exact registry version must
    # still match that package's actual on-disk version - across every
    # template's `package.json` files (found the same manifest-presence way)
    # AND across the ecosystem's own manifests, since `packages/gts-plugin`
    # pins `mfes` exactly. Catches a version bump to `packages/*` that missed
    # a pinned site elsewhere. No build-order dependency: reads `package.json`
    # files directly, not the built CLI.
    - name: Check template ecosystem pin-drift
      run: npm run policy:template-pin-drift

    # #575, follow-up from #574 review: #574 changed `@gears-frontx/react`'s
    # public API and shipped with no version bump, and neither policy check
    # above would have caught it — both are CONSISTENCY checks (does the
    # semver line make sense, do pins match the disk), not CHANGE checks (did
    # a package with substantive changes bump). This diffs the PR branch
    # against its merge base with the target branch and fails for any
    # governed package — every `packages/*` artifact, plus `template-shell`
    # itself and every `template-shell/packages/*` member (any non-`private`
    # `@gears-frontx`-scoped package; `template-mfe` and its fixture apps are
    # `private` and exempt) — whose `src/` (or package.json dependencies)
    # changed without its own `version` changing — comparing actual ref
    # content rather than the diff, so a version bumped then reverted within
    # the same PR still fails. Pull-request-only: the merge base it needs is
    # the PR's base branch, which only exists as `GITHUB_BASE_REF` on
    # `pull_request` events.
    - name: Check version bump on substantive package change
      if: github.event_name == 'pull_request'
      run: npm run policy:version-bump-on-change

    # #524: `npm install` reconciling an out-of-sync template lockfile drops
    # the template's `file:.` self-link entry, writing a lockfile its own
    # `npm ci` then rejects ("Missing: ... from lock file") — and reconciling
    # is exactly what `npm ci`'s out-of-sync error tells the developer to do.
    # This asserts every self-link a template's manifest declares still has
    # its lockfile entry, so the failure names the vanished entry at commit
    # time instead of surfacing as a generic `npm ci` red in template CI.
    # No build-order dependency: reads the JSON files directly.
    - name: Check template lockfile self-link entries
      run: npm run policy:template-lockfile-selflink

    # #540: the import-boundary check ADR-0003's confirmation section promised.
    # The mfes barrel must not export concrete Default* implementations, and no
    # code outside `packages/mfes` may import a concrete implementation name
    # from `@gears-frontx/mfes` (or deep-import a subpath past the barrel) —
    # consumers obtain the registry via `createMfeRegistryFactory()` alone.
    # No build-order dependency: reads source files directly.
    - name: Check mfes import boundary (ADR-0003)
      run: npm run policy:mfes-import-boundary

    # #586: template and ui-kit design tokens are full CSS colors consumed as
    # `var(--x)`, never shadcn-style HSL fragments consumed as
    # `hsl(var(--x))` — a stale wrapper reads a full color where a fragment is
    # expected and the style silently disappears (invalid at computed-value
    # time), which lint, type-check, and jsdom tests all miss. Scope is
    # template territory (manifest-presence discovery, same as the guards
    # above); `packages/cli/templates/` keeps its self-consistent legacy
    # vocabulary and is deliberately out of scope. No build-order dependency:
    # reads source files directly.
    - name: Check template token format (full-color vocabulary)
      run: npm run policy:token-format

    # The design-guardrails bundle routes guideline loading through the
    # generated `reference-artifacts/guideline-index.json`, derived from each
    # guideline's front matter (`scripts/generate-guideline-index.mjs`). The
    # front matter is the source of truth; this asserts the checked-in index
    # matches it, so a guideline edit cannot land without regenerating the
    # index and a hand edit to the index cannot land at all.
    - name: Check guideline index is generated from front matter
      run: npm run policy:guideline-index

  # The template-*/ trees carry their own arch:deps / lint / test:unit scripts,
  # and nothing else in this workflow enters them — so without this job their
  # checks are enforced only when someone runs them by hand, and they rot
  # (#483).
  #
  # The template-shell/template-mfe split (#470) produced two kinds of
  # template, and both need covering:
  #   - self-contained (template-shell): a root package.json of its own
  #     publishable identity and lockfile, validated standalone by the glob
  #     loop below, which deliberately avoids hardcoding template names;
  #   - add-only overlay (template-mfe): no root package.json of its own
  #     publishable identity, no tooling of its own. It cannot be validated in
  #     place — its packages' file: links resolve to template-mfe/packages/*
  #     (which does not exist), and their vite/vitest configs import out of
  #     the shell. The only way to run their checks is to compose the pair the
  #     way `frontx register`/`frontx apply` does and validate the result,
  #     which the second step
  #     does.
  template-validate:
    name: Template Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '25.x'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          template-*/package-lock.json

    - name: Enable Corepack
      run: corepack enable

    # The templates pin @gears-frontx/* to exact registry versions (#485), so
    # every template check below resolves published tarballs and NOT this repo's
    # packages/. That is the point: this job validates what a seeded project
    # actually installs, which is why a pin lagging the ecosystem surface has to
    # fail here — that drift is what `dev:template:link` papers over locally,
    # and papering over it in CI would leave a seeded project broken with
    # nothing red to show it.
    #
    # This step is still required even though the pins no longer resolve here.
    # The templates do not declare their whole toolchain: template-shell's
    # eslint.config.js imports `typescript-eslint`, which is absent from its own
    # devDependencies and resolves upward into the repo root's node_modules. Drop
    # the root install and `npm run lint` below fails to load its config.
    # Only the install is needed — no `build:packages`: with the pins on
    # registry tarballs, nothing in this job reads the workspace packages'
    # dist/ output.
    #
    # A seeded project standing on its own therefore cannot run that lint at all;
    # what covers it here is the monorepo's tree, not the template's. Tracked as
    # part of the templates' declared-toolchain gap, not something this job can
    # fix by installing differently.
    - name: Install ecosystem toolchain
      run: npm ci

    # Split the templates by an observable fact on disk, cross-checked against
    # each manifest's own identity — the current four-field manifest contract
    # (cpt-frontx-adr-template-manifest-contract) declares no ownership
    # category at all any more (schemaVersion/ownershipBoundaries were retired
    # this checkpoint), so there is nothing left in a manifest to read for
    # this decision. A template that ships a root package.json under its OWN
    # publishable identity (the package.json's own "name" equals the
    # manifest's own "name") owns its own tooling and is validated standalone;
    # one that does not is an add-only overlay and is only meaningful composed
    # onto a shell.
    #
    # Bare disk presence (a plain `-f package.json` check) is the wrong test on
    # its own: #489 adds a root package.json to template-mfe as a
    # monorepo-only dev harness (`frontx-template-mfe-monorepo-harness`,
    # unscoped, `private: true` — see that file's own header), deliberately
    # never declared as the template's shipped identity so registering and
    # applying the template never copies it anywhere. A bare presence check
    # would route that overlay down the self-contained path and then fail on
    # the arch:deps / lint /
    # test:unit scripts a dev harness has no reason to define. The identity
    # cross-check is what tells "my own root package.json" apart from "a
    # foreign package.json that happens to sit here" without reviving the
    # retired ownership category or guessing from excludedSubtrees's emptiness
    # (which declares reserved ground for a NESTED template, not "do I own my
    # own tooling" — a template with nothing to reserve is not thereby an
    # overlay).
    - name: Classify templates
      run: |
        set -euo pipefail
        node -e '
          const fs = require("fs");
          const selfContained = [], overlays = [];
          for (const dir of fs.readdirSync(".").filter((d) => d.startsWith("template-")).sort()) {
            if (!fs.existsSync(dir + "/frontx-template.json")) continue;
            const manifest = JSON.parse(fs.readFileSync(dir + "/frontx-template.json", "utf8"));
            const pkgPath = dir + "/package.json";
            const ownsRootPackageJson = fs.existsSync(pkgPath)
              && JSON.parse(fs.readFileSync(pkgPath, "utf8")).name === manifest.name;
            (ownsRootPackageJson ? selfContained : overlays).push(dir);
          }
          if (!selfContained.length) throw new Error("no self-contained template found");
          console.log("self-contained: " + selfContained.join(" "));
          console.log("overlays: " + (overlays.join(" ") || "(none)"));
          fs.appendFileSync(process.env.GITHUB_ENV,
            `SELF_CONTAINED_TEMPLATES=${selfContained.join(" ")}\n` +
            `OVERLAY_TEMPLATES=${overlays.join(" ")}\n`);
        '

    # Both template steps below run their installs from a copy placed OUTSIDE
    # the checkout. Inside it, the repository root's node_modules (this job's
    # own `npm ci` above) is an ancestor directory of the template, and Node's
    # resolution walks up to it: a dependency the template's lockfile fails to
    # install is still found there, and the template passes on a graph a
    # standalone `frontx seed` never gets. That is how a shell lockfile whose
    # ui-kit entry lacked @shadcn/react - a real runtime dependency of the
    # pinned version - stayed green here while the composed a11y suite failed
    # outside the monorepo (PR #586 review). node_modules is left behind on
    # purpose: the copy installs from its own lockfile and nothing else.
    - name: Validate self-contained templates
      run: |
        set -euo pipefail
        for template in $SELF_CONTAINED_TEMPLATES; do
          echo "==> Validating $template"
          isolated="$RUNNER_TEMP/standalone-$(basename "$template")"
          rm -rf "$isolated" && mkdir -p "$isolated"
          tar -C "$template" --exclude=node_modules -cf - . | tar -C "$isolated" -xf -
          (
            cd "$isolated"
            npm ci
            # Full `build`, not just build:package/build:packages — it also
            # chains build:mfes, generate:mfe-manifests and vite build, which
            # nothing else in CI runs. It comes first so the later checks see
            # the generated manifests.
            npm run build
            npm run type-check
            npm run arch:deps
            npm run lint
            npm run test:unit
          )
        done

    # Proves the "no self-nesting" guard below actually rejects the shape it
    # exists to catch, rather than being trusted on the strength of a comment.
    # PR #586's review is the reason this exists: the doubled-path defect
    # (`src-app/mfe_packages/src-app/mfe_packages/...`) shipped past a
    # count-only version of that check because a doubled tree still has a
    # positive package count, and nothing in this job's history had ever
    # driven the fixed check through a tree it should reject. Calls the SAME
    # `.github/scripts/assert-overlay-not-doubled.sh` the real step below
    # calls, on synthetic fixtures that cost nothing to build (no npm, no
    # real templates) — a future edit that guts the shared script is caught
    # here, not by a reviewer reading it a second time. Run BEFORE the real
    # composition step so a broken guard is caught here, against a fixture
    # built for exactly this purpose, rather than trusted to correctly police
    # the real overlay tree the next step composes.
    - name: Self-test composition guard against a doubled tree
      run: |
        set -euo pipefail
        guard=".github/scripts/assert-overlay-not-doubled.sh"
        fixture="$RUNNER_TEMP/composition-guard-selftest"
        rm -rf "$fixture" && mkdir -p "$fixture"

        # Doubled case: the overlay's own target path exists a second time
        # inside itself — exactly the shape the real defect produced. The
        # guard MUST reject this; if it does not, the guard is broken.
        mkdir -p "$fixture/doubled/dest/some/target"
        if "$guard" "$fixture/doubled/dest" "some/target" "selftest-overlay"; then
          echo "::error::composition guard accepted a doubled tree it exists to reject — self-test failed"
          exit 1
        fi
        echo "==> guard correctly rejected a doubled tree"

        # Correct case: the target path exists exactly once (no self-nested
        # copy). The guard MUST accept this; if it does not, it now rejects
        # ordinary correct compositions too.
        mkdir -p "$fixture/correct/dest"
        if ! "$guard" "$fixture/correct/dest" "some/target" "selftest-overlay"; then
          echo "::error::composition guard rejected a correctly-rooted tree — self-test failed"
          exit 1
        fi
        echo "==> guard correctly accepted a non-doubled tree"

    # Composes the overlays onto the shell and runs the shell's checks over the
    # union — the tree a real `frontx register`/`frontx apply` of the shell
    # followed by the mfe template produces.
    # This is what actually covers the MFE packages: the shell's eslint config
    # has an src-app/mfe_packages/** block, its dependency-cruiser config has
    # no-cross-mfe-imports, and its test:unit ends in
    # `--workspaces --if-present` — all three are no-ops until the overlay lands.
    # `build:mfes` and `type-check:mfe` cover them too, but only under the
    # FRONTX_INCLUDE_TEMPLATE_EXAMPLES opt-in set on those steps below, since
    # every package composed here is one the template ships as an example.
    #
    # Nothing in the manifests says which shell an overlay belongs to, so this
    # requires exactly one self-contained template and composes every overlay
    # onto it. There is no manifest-declared subtree list to read any more —
    # the four-field contract has no field for "where does my content land"
    # (composition is now driven by the caller's explicit application, not by
    # one template naming the other, cpt-frontx-adr-template-manifest-contract
    # §1.2).
    #
    # Each overlay's payload is now re-rooted at its OWN template root — it is
    # exactly what a real `frontx apply <template> <target>` would place under
    # whatever target the caller names, with no ownership prefix inside it any
    # more (the doubled-prefix defect this repo's three real templates carried
    # until this fix). That means the target is not something this job can
    # read off the overlay's directory structure the way the old subtree-per-
    # subtree copy did — it is an application-time decision, same as a real
    # `apply` call needs a caller to supply one. OVERLAY_TARGETS below mirrors
    # the target map this repo has actually decided for its own templates
    # (see the manifest cutover's decomposition); a new overlay needs an entry
    # added here for the same reason a real deployment needs an operator to
    # choose where it lands — there is no way to derive it structurally, and a
    # missing entry fails the step rather than silently skipping composition.
    #
    # What lands at that target is the overlay's whole PAYLOAD: every
    # top-level entry the overlay has, files included, excluding only
    # `frontx-template.json` (never payload) and `.frontx` (the CLI-reserved
    # namespace an AI-extension bundle is delivered through by a separate
    # mechanism) and `node_modules` (install-time output) — the same
    # structural fact `cpt-frontx-feature-template-manifest`'s own §1.2 payload
    # definition and `validate-content-self-containment.ts` already rely on.
    # Top-level files (template-mfe's README.md, template-design-guardrails's
    # DESIGN.md) are copied too, unlike the old subtree-only copy: a real
    # `apply` places them under the target like everything else, and there is
    # no shell-root collision to dodge any more now that each overlay owns a
    # target the shell has reserved for it (`excludedSubtrees`) instead of
    # landing loose at the shell's root.
    - name: Validate shell + overlay composition
      env:
        # PULL REQUESTS ONLY: on a develop push, main.yml and publish-packages.yml
        # start together, so for a few minutes the just-merged version is both
        # unpublished and equal to the local one — substituting there would
        # paper over a publish that failed or has not landed yet. See
        # scripts/pin-unpublished-ecosystem-to-local-pack.mjs for the
        # substitution criterion this enables.
        FRONTX_SUBSTITUTE_UNPUBLISHED_PINS: ${{ github.event_name == 'pull_request' && '1' || '' }}
      run: |
        set -euo pipefail

        # shellcheck disable=SC2086
        set -- $SELF_CONTAINED_TEMPLATES
        if [ "$#" -ne 1 ]; then
          echo "::error::composition needs exactly one self-contained template, got: $*"
          exit 1
        fi
        shell="$1"

        if [ -z "${OVERLAY_TEMPLATES// /}" ]; then
          echo "::error::no overlay templates found — this step would be a no-op"
          exit 1
        fi

        declare -A OVERLAY_TARGETS=(
          [template-mfe]="src-app/mfe_packages"
          [template-design-guardrails]="src-app/verify_packages"
        )

        # Every check below is a silent no-op if an overlay did not land —
        # eslint just matches no files, test:unit finds no extra workspaces.
        # That vacuous pass is the exact failure mode this job exists to
        # catch, so each overlay's own contribution is counted as it lands,
        # not folded into one total afterwards: a target that exists but holds
        # no package.json must not be hidden by another overlay's packages
        # passing the count for everyone. Both overlays this repo ships today
        # contribute at least one package.json (template-mfe's four fixture
        # apps, template-design-guardrails's design-verify package), so there
        # is no "manifest-only, zero packages by design" exemption here any
        # more — a future pure-docs overlay would need one added back
        # alongside its OVERLAY_TARGETS entry above.
        #
        # A bare COUNT of package.json files under $dest is not enough: the
        # doubled-path defect this job exists to catch
        # (`src-app/mfe_packages/src-app/mfe_packages/...`, shipped past the
        # count-only version of this check because a doubled tree still has a
        # positive count) needed an EXACT expected path per package, so a
        # package landing one directory level deeper than intended still
        # fails. OVERLAY_PACKAGES is that explicit expectation, paths relative
        # to the overlay's own root — same fail-closed shape as
        # OVERLAY_TARGETS above: a new overlay, or a new package inside an
        # existing one, needs an entry added here for the same reason.
        declare -A OVERLAY_PACKAGES=(
          [template-mfe]="demo-mfe/package.json _blank-mfe/package.json widgets-fixture-a/package.json widgets-fixture-b/package.json"
          [template-design-guardrails]="design-verify/package.json"
        )

        # nullglob turns a top-level pattern that matches nothing (should
        # never happen — caught below by overlay_count) into zero iterations
        # instead of a literal, unexpanded pattern string.
        shopt -s nullglob

        composed_total=0
        for overlay in $OVERLAY_TEMPLATES; do
          target="${OVERLAY_TARGETS[$overlay]:-}"
          if [ -z "$target" ]; then
            echo "::error::$overlay has no declared composition target — add it to OVERLAY_TARGETS in this step"
            exit 1
          fi

          dest="$shell/$target"
          mkdir -p "$dest"
          echo "==> Overlaying $overlay onto $target"
          for entry in "$overlay"/*; do
            name="$(basename "$entry")"
            # `.frontx` is never matched by this glob by default (bash does
            # not expand `*` over dot-prefixed names without `dotglob`, which
            # this step does not set) — the explicit skip below is the same
            # rule stated defensively, not relied on twice.
            [ "$name" = ".frontx" ] && continue
            [ "$name" = "node_modules" ] && continue
            [ "$name" = "frontx-template.json" ] && continue
            cp -R "$entry" "$dest/"
          done

          # Each MFE ships a standalone package-lock.json whose file:
          # targets point into template-mfe/packages/*, which does not
          # exist. npm ignores nested locks inside a workspace, but drop
          # them so nothing reads them — from the target just populated, not
          # a hardcoded mfe_packages path.
          find "$dest" -not -path '*/node_modules/*' \
            -name package-lock.json -delete

          # Exact-path assertion, not a count: each declared package must
          # exist at precisely $dest/<relative path> — the path
          # OVERLAY_PACKAGES says a correctly-rooted payload produces. A
          # doubled-prefix defect would land it one (or more) directories
          # deeper instead, which a `find -name package.json | wc -l` count
          # cannot distinguish from the correct tree (both are non-zero) but
          # this can.
          packages="${OVERLAY_PACKAGES[$overlay]:-}"
          if [ -z "$packages" ]; then
            echo "::error::$overlay has no declared expected packages — add it to OVERLAY_PACKAGES in this step"
            exit 1
          fi

          overlay_count=0
          for rel in $packages; do
            if [ ! -f "$dest/$rel" ]; then
              echo "::error::$overlay's payload landed at $target but the expected package $rel is missing — not found at $dest/$rel"
              exit 1
            fi
            overlay_count=$((overlay_count + 1))
          done

          # No self-nesting: composing $overlay's payload into $target must
          # never reproduce $target's own path again inside itself. This is
          # exactly the doubled-path defect's shape
          # (`src-app/mfe_packages/src-app/mfe_packages/...` — the overlay's
          # payload still carrying its own ownership-prefixed root instead of
          # being rooted at the overlay's top level) and is checked
          # independently of the exact-path assertion above, since a defect
          # that duplicated only SOME of a target's segments (not deep enough
          # to also miss a declared package) would otherwise pass it.
          # Delegated to the shared script (rather than inlined here) so the
          # "Self-test composition guard against a doubled tree" step earlier
          # in this job exercises the identical check, not a copy of it.
          .github/scripts/assert-overlay-not-doubled.sh "$dest" "$target" "$overlay"

          echo "==> $overlay contributed $overlay_count package(s) at $target"
          composed_total=$((composed_total + overlay_count))
        done
        echo "==> Composed $composed_total package(s) into $shell"

        # Captured before the `cd` below, because everything after it runs from
        # $RUNNER_TEMP and still has to reach this checkout's scripts.
        repo="$PWD"

        # Out of the checkout before installing, for the reason given above
        # the standalone step: an ancestor node_modules must not be able to
        # supply what the composed lockfile does not.
        composed="$RUNNER_TEMP/composed-$(basename "$shell")"
        rm -rf "$composed" && mkdir -p "$composed"
        tar -C "$shell" --exclude=node_modules -cf - . | tar -C "$composed" -xf -

        # Pointed at the composed COPY: the tarballs are packed into it so every
        # `file:` specifier stays a relative path inside it, not one climbing
        # out of $RUNNER_TEMP. Run before `cd` because the script resolves
        # this repo's packages/* from its own location.
        #
        # The trap makes the undo run even if `npm install` fails under
        # `set -e`, which would otherwise skip the restore line below and leave
        # the tree rewritten for whatever reads it next. Registered once the
        # call above succeeds; `--restore` is a no-op if nothing was rewritten.
        if [ -n "${FRONTX_SUBSTITUTE_UNPUBLISHED_PINS:-}" ]; then
          node scripts/pin-unpublished-ecosystem-to-local-pack.mjs --tree "$composed"
          # `|| true` is load-bearing, not defensive noise: bash carries the
          # pre-trap exit status through an EXIT handler that ends successfully,
          # but a handler whose LAST command fails overwrites it — measured both
          # ways — so an unguarded restore could turn a green step red. Guarded,
          # 0 stays 0 and a failing install stays failing, with no `$?` dance.
          # It also means a restore failure on the red path cannot mask the
          # install failure that is the actual finding.
          trap 'node "$repo/scripts/pin-unpublished-ecosystem-to-local-pack.mjs" --tree "$composed" --restore || true' EXIT
        fi

        cd "$composed"
        # npm install, not npm ci: the shell's committed lockfile is generated
        # without the overlay, so it has no mfe_packages entries and `ci` would
        # fail as out of sync. Re-installing after an `add` is the documented
        # workflow (template-mfe/README.md).
        npm install

        # Must run before anything below reads these manifests as committed —
        # see RESTORE_JOURNAL_NAME's docblock in the script for why.
        if [ -n "${FRONTX_SUBSTITUTE_UNPUBLISHED_PINS:-}" ]; then
          node "$repo/scripts/pin-unpublished-ecosystem-to-local-pack.mjs" --tree "$composed" --restore
        fi

        # FRONTX_INCLUDE_TEMPLATE_EXAMPLES=1 on both commands below, because every
        # MFE package this job composes is one the template ships as an example
        # and therefore declares `"templateExample": true`. Without the opt-in
        # the three package scanners skip all four, `build:mfes` and
        # `type-check:mfe` report an empty set and exit 0, and this job — the
        # only CI path that compiles the overlaid MFEs at all — passes having
        # compiled nothing. That vacuous pass is the failure mode this job
        # exists to catch, so the examples are opted back in here. A seeded
        # project wants the opposite default, which is why the flag lives in the
        # environment rather than in the packages.
        #
        # `build` compiles the overlaid MFEs (build:mfes) and emits their
        # manifests into the aggregate, which the standalone run has nothing to
        # do.
        FRONTX_INCLUDE_TEMPLATE_EXAMPLES=1 npm run build
        # `type-check` ends in type-check:mfe, which reports "no MFE packages"
        # in the standalone run above and spawns a child per composed package
        # here. It runs after `build`: each package type-checks against the
        # workspace packages' `dist/` types, so on an unbuilt tree every one of
        # them fails to resolve its `@gears-frontx/*` imports.
        FRONTX_INCLUDE_TEMPLATE_EXAMPLES=1 npm run type-check
        # No opt-in needed below: these three reach the composed packages
        # through eslint's own glob and npm's workspaces, not through the
        # scanners the flag governs.
        npm run arch:deps
        npm run lint
        npm run test:unit

  studio-validate:
    name: Studio Validate Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Constructor Studio CLI
        run: pipx install "git+https://github.com/constructorfabric/studio.git@v1.6.2"

      # .cf-studio/.core is gitignored (Constructor-Studio-owned, regenerated
      # on demand) — materialize it before invoking studio.py directly.
      - name: Bootstrap Constructor Studio runtime
        run: cfs update -y --no-interactive --with-kits yes
        env:
          # cfs resolves the Studio release via the GitHub API; anonymous
          # requests from shared runner IPs hit the rate limit (HTTP 403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate artifacts and traceability
        run: python3 .cf-studio/.core/skills/studio/scripts/studio.py validate

  studio-validate-kits:
    name: Studio Validate Kits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Constructor Studio CLI
        run: pipx install "git+https://github.com/constructorfabric/studio.git@v1.6.2"

      - name: Bootstrap Constructor Studio runtime
        run: cfs update -y --no-interactive --with-kits yes
        env:
          # cfs resolves the Studio release via the GitHub API; anonymous
          # requests from shared runner IPs hit the rate limit (HTTP 403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate installed kits
        run: python3 .cf-studio/.core/skills/studio/scripts/studio.py validate-kits

  studio-spec-coverage:
    name: Studio Spec Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Constructor Studio CLI
        run: pipx install "git+https://github.com/constructorfabric/studio.git@v1.6.2"

      - name: Bootstrap Constructor Studio runtime
        run: cfs update -y --no-interactive --with-kits yes
        env:
          # cfs resolves the Studio release via the GitHub API; anonymous
          # requests from shared runner IPs hit the rate limit (HTTP 403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check spec coverage thresholds
        # Threshold rebased for the post-split ecosystem repo. The framework/
        # template split changed the scanned code: solution packages moved out
        # to template-shell/, extracted core-substrate code (api/mfes/gts-plugin)
        # moved in, and tooling scripts/ were removed from the scan. Extracted
        # code + type/interface/glue lines cap fair @cpt marker density well
        # below the old 58 (even greenfield cli/kit top out ~50-56%). Current
        # honest coverage is ~41%; the bar sits just below it with headroom.
        # Raise it as core-substrate (api/mfes/gts-plugin) traceability
        # density improves over time.
        #
        # --min-coverage stays at 38. The scan is 10255 lines over 139 files, so
        # 3 points below the honest 41% is ~308 lines of slack — a normal-sized
        # change, not room for a whole unmarked package. Tightening it further
        # buys ~100 lines and costs every in-flight PR a rebase.
        #
        # --min-granularity is the gap worth closing: 0.28 against an actual
        # 0.7276 permitted covered code to be marked in blocks far coarser than
        # anything in the tree today, which is the failure mode markers exist to
        # prevent. 0.60 keeps 0.12 of headroom.
        #
        # The per-file flags cannot be used yet, and this is measured rather
        # than assumed:
        #   --min-file-coverage    fails on "any file", and 48 of the 139
        #                          scanned files carry no markers at all, so any
        #                          value above 0 fails today.
        #   --min-file-granularity fails on "any covered file", and a small file
        #                          fully covered by one block scores 0.00 — so it
        #                          would fail on the best-covered files in the
        #                          repo, not the worst.
        # Per-system floors (--system) are the useful next step and need more than one
        # registered system; today there is only `frontx`, so a per-system floor
        # is the aggregate under another name.
        run: >-
          python3 .cf-studio/.core/skills/studio/scripts/studio.py
          spec-coverage
          --min-coverage 38
          --min-granularity 0.60

  dependency-graph:
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '25.x'
        cache: 'npm'

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: npm ci

    - name: Generate dependency graph
      run: |
        npm run arch:dot || echo "Failed to generate DOT file"

    - name: Upload dependency graph
      uses: actions/upload-artifact@v5
      with:
        name: dependency-graph
        path: dependency-graph.dot
        retention-days: 30
      continue-on-error: true
